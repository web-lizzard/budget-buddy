# Host has no tmux config (empty ~/.config/tmux mount): fall back to the vendored Omarchy
# defaults (omarchy/tmux.conf, copied into the image as /etc/tmux/omarchy.conf).
if-shell '[ ! -s "$HOME/.config/tmux/tmux.conf" ]' 'source-file /etc/tmux/omarchy.conf'

bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Ctrl-b S → type window number → split that window in ITS cwd (not yours).
bind S command-prompt -p "split window #" "split-window -h -t ':%%' -c '#{pane_current_path}'"

# Mouse: click windows on the status bar, select and resize panes, scroll history.
set -g mouse on
